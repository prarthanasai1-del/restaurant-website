<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SaiCalc | Smart Scientific Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <main class="app">

        <!-- =========================
             CALCULATOR
        ========================== -->

        <section class="calculator">

            <!-- HEADER -->

            <header class="header">

                <div>
                    <h1>SaiCalc</h1>
                    <p>Smart Scientific Calculator</p>
                </div>

                <div class="header-controls">

                    <button id="angleBtn" class="top-btn">
                        DEG
                    </button>

                    <button id="scientificBtn" class="top-btn">
                        SCI
                    </button>

                    <button id="themeBtn" class="top-btn">
                        ☀
                    </button>

                </div>

            </header>


            <!-- DISPLAY -->

            <div class="display">

                <div class="display-top">

                    <span id="modeIndicator">DEG</span>

                    <button id="copyBtn" class="copy-btn" title="Copy result">
                        ⧉
                    </button>

                </div>

                <div id="expression" class="expression">
                    0
                </div>

                <div id="result" class="result">
                    0
                </div>

            </div>


            <!-- SCIENTIFIC PANEL -->

            <div id="scientificPanel" class="scientific-panel">

                <button class="scientific-btn"
                        data-scientific="sin">
                    sin
                </button>

                <button class="scientific-btn"
                        data-scientific="cos">
                    cos
                </button>

                <button class="scientific-btn"
                        data-scientific="tan">
                    tan
                </button>

                <button class="scientific-btn"
                        data-scientific="sqrt">
                    √
                </button>

                <button class="scientific-btn"
                        data-scientific="square">
                    x²
                </button>

                <button class="scientific-btn"
                        data-scientific="power">
                    xʸ
                </button>

                <button class="scientific-btn"
                        data-value="(">
                    (
                </button>

                <button class="scientific-btn"
                        data-value=")">
                    )
                </button>

                <button class="scientific-btn"
                        data-scientific="pi">
                    π
                </button>

                <button class="scientific-btn"
                        data-scientific="e">
                    e
                </button>

            </div>


            <!-- MAIN BUTTONS -->

            <div class="buttons">

                <button class="btn function"
                        data-action="clear">
                    AC
                </button>

                <button class="btn function"
                        data-action="delete">
                    DEL
                </button>

                <button class="btn function"
                        data-action="percentage">
                    %
                </button>

                <button class="btn operator"
                        data-value="/">
                    ÷
                </button>


                <button class="btn"
                        data-value="7">
                    7
                </button>

                <button class="btn"
                        data-value="8">
                    8
                </button>

                <button class="btn"
                        data-value="9">
                    9
                </button>

                <button class="btn operator"
                        data-value="*">
                    ×
                </button>


                <button class="btn"
                        data-value="4">
                    4
                </button>

                <button class="btn"
                        data-value="5">
                    5
                </button>

                <button class="btn"
                        data-value="6">
                    6
                </button>

                <button class="btn operator"
                        data-value="-">
                    −
                </button>


                <button class="btn"
                        data-value="1">
                    1
                </button>

                <button class="btn"
                        data-value="2">
                    2
                </button>

                <button class="btn"
                        data-value="3">
                    3
                </button>

                <button class="btn operator"
                        data-value="+">
                    +
                </button>


                <button class="btn function"
                        data-action="sign">
                    +/−
                </button>

                <button class="btn"
                        data-value="0">
                    0
                </button>

                <button class="btn"
                        data-value=".">
                    .
                </button>

                <button class="btn equals"
                        data-action="calculate">
                    =
                </button>

            </div>


            <!-- KEYBOARD INFO -->

            <div class="keyboard-info">
                <span>⌨ Keyboard supported</span>
                <span>Enter = Calculate</span>
                <span>Esc = Clear</span>
            </div>

        </section>


        <!-- =========================
             HISTORY
        ========================== -->

        <aside class="history">

            <div class="history-header">

                <div>
                    <h2>History</h2>
                    <p>Your recent calculations</p>
                </div>

                <button id="clearHistory"
                        class="clear-history">
                    Clear
                </button>

            </div>

            <div id="historyList"
                 class="history-list">

                <div class="empty-history">
                    No calculations yet
                </div>

            </div>

        </aside>

    </main>


    <script src="script.js"></script>

</body>
</html>
